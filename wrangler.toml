name = "dumbphone-lichess"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Create this KV namespace (Cloudflare dashboard: Workers & Pages > KV > Create),
# then paste its id below. Used for OAuth login sessions.
kv_namespaces = [
  { binding = "KV", id = "eff4a59826bc447ab730870146869d59" }
]

# Durable Object that holds a live connection to a Lichess game's Board API
# stream so Lichess doesn't think we've disconnected between page loads
# (see GameWatcher in src/lichess.js, re-exported from src/index.js). Unlike
# the KV namespace above, this needs no manual dashboard setup - the
# [[migrations]] block below registers the class automatically on deploy.
[[durable_objects.bindings]]
name = "GAME_WATCHER"
class_name = "GameWatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameWatcher"]

# Static assets (the chess piece icons the board renders as /images/*.png).
# Cloudflare serves any request that matches a file in this directory
# directly, without invoking the Worker - so this doesn't cost a request
# to your KV/Lichess-calling code, it's just plain file hosting.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Any unique string identifies your app to Lichess - no registration needed,
# Lichess supports unregistered public OAuth clients. Just keep this constant.
LICHESS_CLIENT_ID = "lichess-dumbphone"

# Must exactly match your deployed Worker URL + "/callback".
# Update this after your first deploy, once you know your workers.dev URL
# (or custom domain).
REDIRECT_URI = "https://dumbphone-lichess.arnavgr.workers.dev/callback"
